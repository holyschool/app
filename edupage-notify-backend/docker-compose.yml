services:
  edupage-notify:
    build: .
    container_name: edupage-notify
    env_file:
      - .env
    ports:
      - "${PORT:-4580}:${PORT:-4580}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '4580') + '/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
