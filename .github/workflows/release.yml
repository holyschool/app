name: Signed release

# Builds a release APK signed with the project keystore when a version tag is pushed,
# then attaches it to the GitHub Release. The keystore and passwords are supplied through
# repository secrets and are never stored in the repository.
#
# Required repository secrets:
#   KEYSTORE_BASE64     base64 of keystore/edupage-release.jks  (`base64 -w0 edupage-release.jks`)
#   KEYSTORE_PASSWORD   store password
#   KEY_ALIAS           key alias (e.g. "edupage")
#   KEY_PASSWORD        key password
# Optional secret:
#   OFFICIAL_BACKEND_KEY   value injected into BuildConfig.OFFICIAL_BACKEND_KEY

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/edupage-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/edupage-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        env:
          OFFICIAL_BACKEND_KEY: ${{ secrets.OFFICIAL_BACKEND_KEY }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/') && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk